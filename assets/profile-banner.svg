<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" role="img" aria-labelledby="title desc">
  <title id="title">Benallal Malek</title>
  <desc id="desc">Frontend and WordPress developer. An illustrated code editor sits beside the name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a1734"/>
      <stop offset=".56" stop-color="#11152b"/>
      <stop offset="1" stop-color="#122037"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b7a2ff"/>
      <stop offset="1" stop-color="#78dcf9"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#8a9bbb" opacity=".24"/>
    </pattern>
    <clipPath id="rounded"><rect x="1" y="1" width="1198" height="334" rx="25"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="336" fill="url(#background)"/>
    <rect x="696" width="504" height="336" fill="url(#dots)"/>
    <path d="M1100 15H1040L1007 48H811M1200 280h-103l-39 39H907" fill="none" stroke="#6374a2" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="811" cy="48" r="3.5" fill="#93a8e8"/>
    <circle cx="907" cy="319" r="3.5" fill="#93a8e8"/>
    <rect x="63" y="51" width="32" height="4" rx="2" fill="url(#accent)"/>
    <text x="109" y="58" fill="#b9c5e4" font-family="DejaVu Sans Mono, monospace" font-size="16" letter-spacing="2.3">DEVELOPER PORTFOLIO</text>
    <text x="62" y="148" fill="#f5f7ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="65" font-weight="700" letter-spacing="-2.5">Benallal</text>
    <text x="62" y="225" fill="url(#accent)" font-family="DejaVu Sans, Arial, sans-serif" font-size="65" font-weight="700" letter-spacing="-2.5">Malek</text>
    <text x="65" y="279" fill="#d6e0f9" font-family="DejaVu Sans, Arial, sans-serif" font-size="27">Frontend &amp; WordPress Developer</text>
    <rect x="704" y="66" width="440" height="227" rx="17" fill="#090e1e" opacity=".62"/>
    <rect x="693" y="54" width="440" height="227" rx="17" fill="#141a31" stroke="#55597e"/>
    <path d="M693 99h440" stroke="#414864"/>
    <circle cx="718" cy="77" r="4.5" fill="#ff93a4"/>
    <circle cx="734" cy="77" r="4.5" fill="#ffcc87"/>
    <circle cx="750" cy="77" r="4.5" fill="#88dabc"/>
    <text x="778" y="82" fill="#c9d5f5" font-family="DejaVu Sans Mono, monospace" font-size="14">portfolio.js</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="17">
      <text x="718" y="135" fill="#7888ae">01</text>
      <text x="718" y="170" fill="#7888ae">02</text>
      <text x="718" y="205" fill="#7888ae">03</text>
      <text x="718" y="240" fill="#7888ae">04</text>
      <text x="761" y="135" fill="#eef4ff"><tspan fill="#c1a7ff">const</tspan> developer = {</text>
      <text x="782" y="170" fill="#eef4ff">focus: <tspan fill="#a2e3bc">"WordPress"</tspan>,</text>
      <text x="782" y="205" fill="#eef4ff">builds: [<tspan fill="#a2e3bc">"websites", "stores"</tspan>]</text>
      <text x="761" y="240" fill="#eef4ff">};</text>
    </g>
    <rect x="792" y="226" width="2.4" height="18" rx="1.2" fill="#83e6ff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.49;.5;.99;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="334" rx="25" fill="none" stroke="#55618c" stroke-width="2"/>
